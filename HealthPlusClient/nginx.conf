server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA — any path that isn't a real file falls back to index.html
    # so client-side routing (e.g. /profile, /prescriptions) works on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API. "api" resolves via Docker Compose's internal DNS to the api service.
    # environment.prod.ts uses apiUrl: '/api', so this same-origin proxy avoids CORS entirely.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prescription/avatar images served by the backend's static file middleware.
    location /uploads/ {
        proxy_pass http://api:8080/uploads/;
        proxy_set_header Host $host;
    }
}
