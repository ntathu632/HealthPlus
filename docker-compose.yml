services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: healthplus-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: ./HealthPlus
      dockerfile: HealthPlus/Dockerfile
    container_name: healthplus-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=HealthPlusDB;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Email__Host: ${EMAIL_HOST:-}
      Email__Port: ${EMAIL_PORT:-587}
      Email__UseSsl: ${EMAIL_USE_SSL:-true}
      Email__SenderEmail: ${EMAIL_SENDER:-}
      Email__SenderName: HealthPlus
      Email__Username: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Firebase__CredentialsPath: ${FIREBASE_CREDENTIALS_PATH:-firebase-service-account.json}
      Twilio__AccountSid: ${TWILIO_ACCOUNT_SID:-}
      Twilio__AuthToken: ${TWILIO_AUTH_TOKEN:-}
      Twilio__FromPhoneNumber: ${TWILIO_FROM_PHONE_NUMBER:-}
    volumes:
      - ./HealthPlus/HealthPlus/uploads:/app/uploads
      - ./HealthPlus/HealthPlus/logs:/app/logs
      # Optional — only uncomment once you've created this file (see PROGRESS.md → "Cấu hình Notification thật"):
      # - ./HealthPlus/HealthPlus/firebase-service-account.json:/app/firebase-service-account.json:ro
    ports:
      - "5146:8080"
    restart: unless-stopped

  client:
    build:
      context: ./HealthPlusClient
    container_name: healthplus-client
    depends_on:
      - api
    ports:
      - "4200:80"
    restart: unless-stopped

volumes:
  sqlserver_data:
